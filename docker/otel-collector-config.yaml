# ContextForge OpenTelemetry Collector Configuration
# Receives traces/metrics from services and exports to backends

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'contextforge-api'
          static_configs:
            - targets: ['api:8000']
          metrics_path: '/metrics'

        - job_name: 'contextforge-worker'
          static_configs:
            - targets: ['worker:8000']
          metrics_path: '/metrics'

        - job_name: 'postgres'
          static_configs:
            - targets: ['postgres:9187']

        - job_name: 'redis'
          static_configs:
            - targets: ['redis:9121']

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8888

  logging:
    loglevel: debug

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: service.name
        value: "contextforge"
        action: upsert
      - key: deployment.environment
        value: "development"
        action: upsert

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp, logging]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]