# ContextForge Development Docker Compose
# Local development with hot reload, no resource limits
# Usage: make dev (or docker compose -f docker/docker-compose.yml up -d)

version: '3.9'

services:
  # =============================================================================
  # PostgreSQL with pgvector
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-contextforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-contextforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contextforge-network

  # =============================================================================
  # Redis (Broker, Cache, Rate Limiting)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: contextforge-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - contextforge-network

  # =============================================================================
  # Langfuse (Observability)
  # =============================================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: contextforge-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contextforge}
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-secret-change-in-production}
      SALT: ${LANGFUSE_SALT:-dev-salt-change-in-production}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-dev-encryption-key-32-chars-long!!}
      REDIS_URL: redis://redis:6379/3
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - contextforge-network

  # =============================================================================
  # API Server (Development with Hot Reload)
  # =============================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: contextforge-api
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contextforge}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - VECTOR_STORE=pgvector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../uv.lock:/app/uv.lock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - contextforge-network
    restart: unless-stopped
    command: uvicorn contextforge.api.main:app --host 0.0.0.0 --port 8000 --reload

  # =============================================================================
  # Celery Worker (Development)
  # =============================================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      target: development
    container_name: contextforge-worker
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contextforge}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - VECTOR_STORE=pgvector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
    volumes:
      - ../src:/app/src:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../uv.lock:/app/uv.lock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - contextforge-network
    restart: unless-stopped
    command: celery -A contextforge.workers.celery_app worker --loglevel=info --concurrency=2

  # =============================================================================
  # MCP Gateway (Development with Hot Reload)
  # =============================================================================
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      target: development
    container_name: contextforge-mcp
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contextforge}
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_STORE=pgvector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8001
      - MCP_AUTH_ENABLED=false
      - MCP_ALLOWED_ORIGINS=*
    ports:
      - "8001:8001"
    volumes:
      - ../src:/app/src:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../uv.lock:/app/uv.lock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - contextforge-network
    restart: unless-stopped
    command: python -m contextforge.mcp.gateway --host 0.0.0.0 --port 8001 --reload

  # =============================================================================
  # Celery Beat Scheduler (Development)
  # =============================================================================
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      target: development
    container_name: contextforge-beat
    command: celery -A contextforge.workers.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contextforge}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - ../src:/app/src:ro
      - beat_data:/app/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - contextforge-network
    restart: unless-stopped

  # =============================================================================
  # OpenTelemetry Collector (Development)
  # =============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: contextforge-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    depends_on:
      - tempo
      - prometheus
    networks:
      - contextforge-network

  # =============================================================================
  # Tempo (Traces)
  # =============================================================================
  tempo:
    image: grafana/tempo:2.4.0
    container_name: contextforge-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "9096:9096"   # gRPC
    networks:
      - contextforge-network

  # =============================================================================
  # Prometheus (Metrics)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: contextforge-prometheus
    command:
      - '--config.file=/etc/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - contextforge-network

  # =============================================================================
  # Grafana (Visualization)
  # =============================================================================
  grafana:
    image: grafana/grafana:10.3.0
    container_name: contextforge-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - contextforge-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  beat_data:
  tempo_data:
  prometheus_data:
  grafana_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  contextforge-network:
    driver: bridge