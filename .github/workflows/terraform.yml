name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, prod]
        default: staging

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.8.0'
  TERRAFORM_DIR: infra/terraform

jobs:
  # =============================================================================
  # Terraform Format & Validate
  # =============================================================================
  fmt-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # =============================================================================
  # Terraform Plan (PR)
  # =============================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fmt-validate
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=contextforge/${{ github.event.inputs.environment || 'staging' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan
        continue-on-error: true

      - name: Convert Plan to JSON
        if: always()
        run: terraform show -json tfplan > tfplan.json

      - name: Comment PR with Plan Summary
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('${{ env.TERRAFORM_DIR }}/tfplan.json', 'utf8'));

            let summary = '## 📋 Terraform Plan Summary\n\n';

            if (plan.planned_values) {
              const resources = plan.planned_values.root_module.resources || [];
              const changes = plan.resource_changes || [];

              let create = 0, update = 0, delete = 0, noop = 0;

              for (const change of changes) {
                const action = change.change.actions[0];
                if (action === 'create') create++;
                else if (action === 'update') update++;
                else if (action === 'delete') delete++;
                else noop++;
              }

              summary += `| Action | Count |\n|--------|-------|\n`;
              summary += `| Create | ${create} |\n`;
              summary += `| Update | ${update} |\n`;
              summary += `| Delete | ${delete} |\n`;
              summary += `| No-op | ${noop} |\n\n`;

              if (delete > 0) {
                summary += '⚠️ **Warning: Resources will be deleted!**\n\n';
              }
            } else {
              summary += 'No changes planned.\n';
            }

            summary += '\n---\n*Generated by GitHub Actions*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_DIR }}/tfplan
          retention-days: 7

  # =============================================================================
  # Terraform Apply (Main Branch)
  # =============================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: fmt-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.event.inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=contextforge/${{ github.event.inputs.environment || 'staging' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Output Key Values
        run: |
          echo "ALB DNS: $(terraform output -raw alb_dns_name)"
          echo "DB Endpoint: $(terraform output -raw db_endpoint)"
          echo "Redis Endpoint: $(terraform output -raw redis_endpoint)"
          echo "ECR API URL: $(terraform output -raw ecr_api_repository_url)"
          echo "ECR Worker URL: $(terraform output -raw ecr_worker_repository_url)"
          echo "ECR MCP URL: $(terraform output -raw ecr_mcp_repository_url)"

  # =============================================================================
  # Manual Terraform Operations (workflow_dispatch)
  # =============================================================================
  manual-terraform:
    name: Manual Terraform Operation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=contextforge/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        if: github.event.inputs.action != 'destroy'
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform plan -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan-destroy
          terraform apply -auto-approve tfplan-destroy