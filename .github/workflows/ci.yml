# ContextForge CI Pipeline
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC for nightly eval

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.0"

jobs:
  # =============================================================================
  # Lint & Type Check
  # =============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff (lint)
        run: uv run ruff check src tests

      - name: Run Ruff (format check)
        run: uv run ruff format --check src tests

      - name: Run MyPy
        run: uv run mypy src

  # =============================================================================
  # Unit Tests
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unit

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contextforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/contextforge_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      VECTOR_STORE: pgvector
      LOCAL_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5  # Smaller model for CI
      LOCAL_EMBEDDING_DIMENSIONS: 384
      LOG_LEVEL: DEBUG

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Wait for services
        run: |
          sleep 10
          pg_isready -h localhost -p 5432 -U postgres
          redis-cli ping

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short -m "not slow"

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: integration

  # =============================================================================
  # Chunking Evaluation (warn-only, non-blocking)
  # =============================================================================
  chunking-eval:
    name: Chunking Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run chunking evaluation
        run: |
          uv run python -m src.contextforge.evaluation.chunking.metrics \
            --golden-set tests/evaluation/golden_sets/v2_expanded.jsonl \
            --output chunking_eval_results.json
        continue-on-error: true

      - name: Upload chunking eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunking-eval-results
          path: chunking_eval_results.json

  # =============================================================================
  # Embedding Evaluation (warn-only, non-blocking)
  # =============================================================================
  embedding-eval:
    name: Embedding Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run embedding evaluation
        run: |
          uv run python -m src.contextforge.evaluation.embedding.metrics \
            --golden-set tests/evaluation/golden_sets/v2_expanded.jsonl \
            --output embedding_eval_results.json
        continue-on-error: true

      - name: Upload embedding eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-eval-results
          path: embedding_eval_results.json

  # =============================================================================
  # Evaluation Tests (Slow)
  # =============================================================================
  eval-tests:
    name: Evaluation Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contextforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/contextforge_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      VECTOR_STORE: pgvector
      LOCAL_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      LOCAL_EMBEDDING_DIMENSIONS: 384
      LOG_LEVEL: DEBUG
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_PROJECT: contextforge-ci
      LANGCHAIN_ENDPOINT: https://api.smith.langchain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Wait for services
        run: |
          sleep 10
          pg_isready -h localhost -p 5432 -U postgres

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Push golden set to LangSmith
        run: |
          uv run python -c "
          from src.contextforge.observability.langsmith import create_langsmith_evaluator
          evaluator = create_langsmith_evaluator()
          if evaluator.is_enabled:
              import json
              with open('tests/evaluation/golden_sets/v2_expanded.jsonl') as f:
                  examples = [json.loads(line) for line in f]
              evaluator.push_golden_set('tests/evaluation/golden_sets/v2_expanded.jsonl', 'golden-qa-v2')
              print('Golden set pushed to LangSmith')
          else:
              print('LangSmith not configured, skipping')
          "
        continue-on-error: true

      - name: Run evaluation tests
        run: uv run pytest tests -v --tb=short -m "eval" --timeout=300

  # =============================================================================
  # Docker Build
  # =============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: contextforge/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: contextforge/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Security Scan
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # Deploy (Manual)
  # =============================================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, unit-tests, integration-tests, docker-build, security]
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging - implement your deployment logic here"
          # Example: kubectl apply -f k8s/staging/
          # or: docker compose -f docker-compose.staging.yml up -d

  # =============================================================================
  # Summary
  # =============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, docker-build, security, chunking-eval, embedding-eval]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Chunking Eval: ${{ needs.chunking-eval.result }}"
          echo "Embedding Eval: ${{ needs.embedding-eval.result }}"

      - name: Fail if any required job failed
        if: >
          needs.lint.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.integration-tests.result != 'success' ||
          needs.docker-build.result != 'success' ||
          needs.security.result != 'success'
        run: |
          echo "One or more required jobs failed"
          exit 1